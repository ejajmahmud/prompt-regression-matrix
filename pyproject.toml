[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-regression-matrix"
version = "0.1.0"
description = "Deterministic prompt evaluation matrix comparing model versions on benchmark testcases"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
prompt-regression-matrix = "prompt_regression_matrix.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["prompt_regression_matrix*"]
